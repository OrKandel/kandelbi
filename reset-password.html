<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>איפוס סיסמה — קנדל BI</title>
<meta name="robots" content="noindex"/>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0d1f3c;--blue:#1e6abf;--bg:#f0f3f8;--white:#fff;--border:#d5dde8;--text:#1a1a2e;--muted:#6b7a99;--red:#d93025;--green:#0a7c5e}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);direction:rtl;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--navy);padding:14px 5vw}
header a{color:#fff;text-decoration:none;font-weight:900;font-size:1.2rem}
.page{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px}
.card{background:var(--white);border-radius:14px;padding:40px 36px;width:100%;max-width:420px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
h1{color:var(--navy);font-size:1.5rem;margin-bottom:6px}
.sub{color:var(--muted);font-size:0.9rem;margin-bottom:28px}
label{display:block;font-weight:700;font-size:0.85rem;margin-bottom:5px;color:var(--navy)}
input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:0.95rem;margin-bottom:18px;transition:border .15s}
input:focus{outline:none;border-color:var(--blue)}
.btn{width:100%;padding:13px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.6;cursor:not-allowed}
.msg{padding:12px 14px;border-radius:8px;font-size:0.88rem;margin-bottom:16px;display:none}
.msg.error{background:#fef2f2;color:var(--red);border:1px solid #fca5a5}
.msg.success{background:#edf7f3;color:var(--green);border:1px solid #6ee7b7}
.links{text-align:center;margin-top:20px;font-size:0.88rem}
.links a{color:var(--blue);text-decoration:none;font-weight:700}
</style>
</head>
<body>
<header><a href="index.html">קנדל BI</a></header>
<div class="page">
  <div class="card">
    <div id="view-request">
      <h1>שכחת סיסמה?</h1>
      <p class="sub">הכנס את כתובת המייל שלך ונשלח לך קישור לאיפוס</p>
      <div class="msg" id="msg-req"></div>
      <label for="email">כתובת מייל</label>
      <input type="email" id="email" placeholder="your@email.com"/>
      <button class="btn" id="btn-send">שלח קישור לאיפוס</button>
      <div class="links" style="margin-top:20px"><a href="login.html">← חזרה לכניסה</a></div>
    </div>

    <div id="view-new-password" style="display:none">
      <h1>סיסמה חדשה</h1>
      <p class="sub">הכנס סיסמה חדשה לחשבונך</p>
      <div class="msg" id="msg-new"></div>
      <label for="new-password">סיסמה חדשה</label>
      <input type="password" id="new-password" placeholder="לפחות 6 תווים"/>
      <label for="confirm-password">אימות סיסמה</label>
      <input type="password" id="confirm-password" placeholder="חזור על הסיסמה"/>
      <button class="btn" id="btn-update">עדכן סיסמה</button>
    </div>
  </div>
</div>
<script>
const SUPABASE_URL='https://jixaskajgkorrjhxiflc.supabase.co';
const SUPABASE_KEY='sb_publishable_5XGh3wyz-KPDh9Zl6liAsQ_yaB8F96X';
const _sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function showMsg(id,text,type){
  const el=document.getElementById(id);
  el.textContent=text;el.className='msg '+type;el.style.display='block';
}

// אם יש token בURL — מצב איפוס סיסמה
_sb.auth.onAuthStateChange((event)=>{
  if(event==='PASSWORD_RECOVERY'){
    document.getElementById('view-request').style.display='none';
    document.getElementById('view-new-password').style.display='';
  }
});

document.getElementById('btn-send').addEventListener('click',async()=>{
  const email=document.getElementById('email').value.trim();
  const btn=document.getElementById('btn-send');
  if(!email){showMsg('msg-req','נא להכניס כתובת מייל','error');return;}
  btn.disabled=true;btn.textContent='שולח...';
  const {error}=await _sb.auth.resetPasswordForEmail(email,{
    redirectTo:window.location.origin+'/reset-password.html'
  });
  if(error){showMsg('msg-req',error.message,'error');btn.disabled=false;btn.textContent='שלח קישור לאיפוס';}
  else showMsg('msg-req','✅ נשלח מייל לאיפוס הסיסמה — בדוק את תיבת הדואר','success');
});

document.getElementById('btn-update').addEventListener('click',async()=>{
  const p1=document.getElementById('new-password').value;
  const p2=document.getElementById('confirm-password').value;
  const btn=document.getElementById('btn-update');
  if(!p1||!p2){showMsg('msg-new','נא למלא את שני השדות','error');return;}
  if(p1!==p2){showMsg('msg-new','הסיסמאות אינן תואמות','error');return;}
  if(p1.length<6){showMsg('msg-new','הסיסמה חייבת להכיל לפחות 6 תווים','error');return;}
  btn.disabled=true;btn.textContent='מעדכן...';
  const {error}=await _sb.auth.updateUser({password:p1});
  if(error){showMsg('msg-new',error.message,'error');btn.disabled=false;btn.textContent='עדכן סיסמה';}
  else{showMsg('msg-new','✅ הסיסמה עודכנה בהצלחה! מעביר לכניסה...','success');setTimeout(()=>window.location.href='login.html',1500);}
});
</script>
</body>
</html>
