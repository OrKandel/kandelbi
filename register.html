<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>הרשמה — קנדל BI</title>
<meta name="robots" content="noindex"/>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0d1f3c;--blue:#1e6abf;--bg:#f0f3f8;--white:#fff;--border:#d5dde8;--text:#1a1a2e;--muted:#6b7a99;--red:#d93025;--green:#0a7c5e}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);direction:rtl;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--navy);padding:14px 5vw}
header a{color:#fff;text-decoration:none;font-weight:900;font-size:1.2rem}
.page{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px}
.card{background:var(--white);border-radius:14px;padding:40px 36px;width:100%;max-width:440px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
h1{color:var(--navy);font-size:1.5rem;margin-bottom:6px}
.sub{color:var(--muted);font-size:0.9rem;margin-bottom:28px}
.trial-badge{background:#e8f5e9;color:var(--green);border:1px solid #a5d6a7;border-radius:8px;padding:10px 14px;font-size:0.85rem;font-weight:700;margin-bottom:24px;text-align:center}
label{display:block;font-weight:700;font-size:0.85rem;margin-bottom:5px;color:var(--navy)}
input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:0.95rem;margin-bottom:18px;transition:border .15s}
input:focus{outline:none;border-color:var(--blue)}
.btn{width:100%;padding:13px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.6;cursor:not-allowed}
.msg{padding:12px 14px;border-radius:8px;font-size:0.88rem;margin-bottom:16px;display:none}
.msg.error{background:#fef2f2;color:var(--red);border:1px solid #fca5a5}
.msg.success{background:#edf7f3;color:var(--green);border:1px solid #6ee7b7}
.links{text-align:center;margin-top:20px;font-size:0.88rem;color:var(--muted)}
.links a{color:var(--blue);text-decoration:none;font-weight:700}
.terms{font-size:0.8rem;color:var(--muted);text-align:center;margin-top:12px}
.terms a{color:var(--blue)}
</style>
</head>
<body>
<header><a href="index.html">קנדל BI</a></header>
<div class="page">
  <div class="card">
    <h1>הרשמה</h1>
    <p class="sub">צור חשבון ותתחיל לעבוד מיד</p>
    <div class="trial-badge">🎁 90 יום ניסיון — ללא כרטיס אשראי</div>
    <div class="msg" id="msg"></div>
    <label for="name">שם מלא</label>
    <input type="text" id="name" placeholder="ישראל ישראלי" autocomplete="name"/>
    <label for="email">כתובת מייל</label>
    <input type="email" id="email" placeholder="your@email.com" autocomplete="email"/>
    <label for="password">סיסמה (לפחות 6 תווים)</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="new-password"/>
    <button class="btn" id="btn-register">יצירת חשבון</button>
    <p class="terms">בהרשמה אתה מסכים ל<a href="terms.html" target="_blank">תנאי השימוש</a></p>
    <div class="links" style="margin-top:16px">כבר יש לך חשבון? <a href="login.html">כניסה</a></div>
  </div>
</div>
<script>
const SUPABASE_URL='https://jixaskajgkorrjhxiflc.supabase.co';
const SUPABASE_KEY='sb_publishable_5XGh3wyz-KPDh9Zl6liAsQ_yaB8F96X';
const _sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function showMsg(text,type){
  const el=document.getElementById('msg');
  el.textContent=text;el.className='msg '+type;el.style.display='block';
}

document.getElementById('btn-register').addEventListener('click',async()=>{
  const name=document.getElementById('name').value.trim();
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const btn=document.getElementById('btn-register');

  if(!name||!email||!password){showMsg('נא למלא את כל השדות','error');return;}
  if(password.length<6){showMsg('הסיסמה חייבת להכיל לפחות 6 תווים','error');return;}

  btn.disabled=true;btn.textContent='יוצר חשבון...';

  const {data,error}=await _sb.auth.signUp({
    email,password,
    options:{data:{full_name:name}}
  });

  if(error){
    const msgs={'User already registered':'כתובת המייל כבר רשומה במערכת — <a href="login.html">להתחברות</a>'};
    showMsg(msgs[error.message]||error.message,'error');
    btn.disabled=false;btn.textContent='יצירת חשבון';
    return;
  }

  // עדכון שם בפרופיל
  if(data.user){
    await _sb.from('profiles').update({name}).eq('id',data.user.id);
  }

  showMsg('✅ נשלח אליך מייל אימות — בדוק את תיבת הדואר ולחץ על הקישור כדי להפעיל את החשבון','success');
  btn.textContent='נשלח מייל אימות';
});
</script>
</body>
</html>
